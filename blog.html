
<!DOCTYPE html>

<head>

    <title>Writing | Abdikhaliq Mohamed</title>
    <link rel="icon" type="image/png" href="favicon.png">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #fff;
            color: #222;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 16px;
            line-height: 1.35;
        }

        a {
            color: #06c;
            text-decoration: underline;
        }

        a:hover {
            color: #004b99;
        }

        /* Top-right navigation */

        .menu {
            position: absolute;
            top: 38px;
            right: 38px;
            text-align: right;
            line-height: 1.25;
        }

        .menu span {
            display: block;
            color: #000;
        }

        .menu a {
            display: block;
        }

        /* Main content column */

        main {
            width: 575px;
            max-width: calc(100% - 40px);
            margin: 41px 0 90px 14vw;
        }

        /* Profile picture */

        .profile-pic {
            width: 150px;
            height: 150px;
            object-fit: cover;
            object-position: center 25%;
            display: block;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 20px;
            font-weight: 600;
            margin: 0 0 14px;
        }

        main p {
            margin: 0 0 16px;
        }

        ul.posts {
            margin: 0;
            padding-left: 24px;
        }

        ul.posts li {
            margin-bottom: 12px;
        }

        ul.posts .date {
            color: #777;
            font-size: 14px;
        }

        /* Mobile layout */

        @media (max-width: 700px) {

            .menu {
                position: static;
                text-align: left;
                padding: 20px 20px 0;
                line-height: 1.6;
            }

            .menu span {
                margin-bottom: 4px;
            }

            .menu a {
                display: inline-block;
                margin-right: 12px;
            }

            main {
                width: auto;
                max-width: none;
                margin: 30px 20px 60px;
            }

            .profile-pic {
                width: 130px;
                height: 130px;
            }
        }

    </style>
</head>

<body>

    <!-- Navigation -->

    <div class="menu">
        <span>Abdikhaliq Mohamed</span>
        <a href="index.html">About</a>
        <a href="blog.html">Writing</a>
    </div>

    <!-- Main content -->

    <main>

        <img
            src="profile.jpg"
            alt="Abdikhaliq Mohamed"
            class="profile-pic"
        >

        <h1>Writing</h1>

        <p>
            Essays and working notes on economics, data,
