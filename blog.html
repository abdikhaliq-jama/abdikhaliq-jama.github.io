<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Writing | Abdikhaliq Jama</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --ink: #1a1a1a;
            --muted: #666;
            --link: #2a2a8f;
            --line: #e6e6e6;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: #fff;
            color: var(--ink);
            font-family: "EB Garamond", Garamond, "Times New Roman", serif;
            font-size: 18px;
            line-height: 1.6;
        }

        a { color: var(--link); text-underline-offset: 3px; }
        a:hover { color: var(--ink); }
        a:focus-visible { outline: 2px solid var(--link); outline-offset: 3px; }

        .wrap { max-width: 860px; margin: 0 auto; padding: 0 28px; }

        /* Header (same as About) */
        header { border-bottom: 1px solid var(--line); }
        header .wrap { display: flex; justify-content: space-between; align-items: baseline; padding-top: 22px; padding-bottom: 18px; }
        .brand { font-size: 22px; font-style: italic; color: var(--ink); text-decoration: none; }
        nav { display: flex; gap: 26px; font-size: 17px; }
        nav a { color: var(--muted); text-decoration: none; padding-bottom: 2px; border-bottom: 1px solid transparent; }
        nav a:hover { color: var(--ink); }
        nav a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--ink); }

        /* Page */
        .head { padding: 64px 0 28px; }
        .head h1 { margin: 0 0 10px; font-size: 44px; font-weight: 400; line-height: 1.1; letter-spacing: -0.01em; }
        .head p { margin: 0; font-size: 21px; font-style: italic; color: var(--muted); line-height: 1.45; max-width: 520px; }

        .empty { margin: 24px 0 0; padding: 22px 0; border-top: 1px solid var(--line); font-size: 20px; font-style: italic; color: #333; }

        .year { margin: 36px 0 0; padding-bottom: 6px; border-bottom: 1px solid var(--ink); font-size: 16px; font-style: italic; color: var(--muted); font-weight: 400; line-height: 1.3; }
        .posts { list-style: none; margin: 0; padding: 0 0 72px; }
        .posts li { border-bottom: 1px solid var(--line); }
        .posts a { display: block; padding: 22px 0; text-decoration: none; color: var(--ink); }
        .posts h3 { margin: 0 0 4px; font-size: 27px; font-weight: 400; line-height: 1.2; }
        .posts a:hover h3 { color: var(--link); }
        .posts p { margin: 0 0 6px; font-size: 17px; line-height: 1.5; color: #444; }
        .posts .meta { font-size: 15px; font-style: italic; color: var(--muted); }

        footer { border-top: 1px solid var(--line); margin-top: 72px; }
        footer .wrap { padding-top: 18px; padding-bottom: 28px; font-size: 14px; color: var(--muted); }

        @media (max-width: 700px) {
            header .wrap { flex-direction: column; align-items: flex-start; gap: 8px; }
            .head { padding-top: 40px; }
            .head h1 { font-size: 36px; }
        }
    </style>
</head>

<body>

    <header>
        <div class="wrap">
            <a class="brand" href="index.html">Abdikhaliq Jama</a>
            <nav aria-label="Main">
                <a href="index.html">About</a>
                <a href="blog.html" aria-current="page">Writing</a>
            </nav>
        </div>
    </header>

    <main class="wrap">
        <div class="head">
            <h1>Writing</h1>
            <p>Essays and working notes on economics, data, and the books in between.</p>
        </div>

        <!-- Delete this paragraph when you publish your first post -->
        <p class="empty">The first essay is on its way. Check back soon, or write to me at <a href="mailto:abdelkhalekjama@gmail.com">abdelkhalekjama@gmail.com</a>.</p>

        <!-- When you have posts, remove the paragraph above and un-comment this block.
             Each new post is one <li>, newest first. Add a new <h2 class="year"> and <ul> for each new year.

        <h2 class="year">2026</h2>
        <ul class="posts">
            <li>
                <a href="my-first-essay.html">
                    <h3>Your post title</h3>
                    <p>A one-sentence summary of the post.</p>
                    <span class="meta">Nov 3 &middot; Economics &middot; 5 min read</span>
                </a>
            </li>
        </ul>
        -->
    </main>

    <footer>
        <div class="wrap">&copy; 2026 Abdikhaliq Jama</div>
    </footer>

</body>
</html>
